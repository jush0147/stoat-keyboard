name: iOS Rime Event Runtime Smoke

on:
  push:
    branches: [dev/learning-events]
    paths:
      - ".github/workflows/rime-runtime.yml"
      - "OnionKB/Harness/**"
      - "OnionKB/Keyboard/RimeEngine.swift"
      - "OnionKB/Keyboard/Rime/RimeEngineLibrime.swift"
      - "OnionKB/Shared/Rime/**"
      - "OnionKB/project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stoat-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-rime-runtime:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Select actual precompiled Stoat dictionary and generate project
        run: |
          mkdir -p RimeData
          bash OnionKB/Scripts/select-variant.sh plustrim
          cd OnionKB
          xcodegen generate
      - name: Build KBHarness using real librime and bundled RimeData
        run: |
          set -o pipefail
          cd OnionKB
          xcodebuild -project OnionKB.xcodeproj -scheme KBHarness \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rime-harness-derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/rime-harness-build.log"
      - name: Boot installed iOS Simulator runtime
        run: |
          set -euo pipefail
          set -euo pipefail
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Simulator SDK version: $SDK_VERSION"
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          sdk=sys.argv[1]
          rows=[r for r in json.load(sys.stdin)["runtimes"]
                if "iOS" in r.get("name","") and r.get("isAvailable",False)]
          exact=[r for r in rows if r.get("version")==sdk]
          if not exact: raise SystemExit("No installed iOS runtime matching Xcode SDK "+sdk)
          print(exact[0]["identifier"])
          ' "$SDK_VERSION")
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          rows=json.load(sys.stdin)["devicetypes"]
          choices=[r for r in rows if r.get("name")=="iPhone 17 Pro"]
          if not choices: choices=[r for r in rows if r.get("name","").startswith("iPhone")]
          if not choices: raise SystemExit("No iPhone Simulator device type available")
          print(choices[0]["identifier"])
          ')
          UDID=$(xcrun simctl create "Stoat-Event-CI" "$DEVICE_TYPE" "$RUNTIME")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Created device $UDID with runtime $RUNTIME"
          xcrun simctl boot "$UDID"
          # Prevent indefinite BackBoard/CoreSimulator readiness hangs.
          perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus "$UDID" -b
      - name: Install and launch real Rime smoke harness in Simulator
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/rime-harness-derived/Build/Products/Debug-iphonesimulator/KBHarness.app"
          test -f "$APP/KBHarness"
          test -n "$(find "$APP" -name 'bopomo_onion*.bin' -print -quit)"
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.kbtest.harness --rime-event-smoke
          DATA_DIR=$(xcrun simctl get_app_container "$SIM_UDID" com.kbtest.harness data)
          RESULT="$DATA_DIR/Documents/rime-event-smoke.json"
          for n in {1..45}; do
            if test -s "$RESULT"; then
              cp "$RESULT" "$RUNNER_TEMP/rime-event-smoke.json"
              break
            fi
            sleep 2
          done
          test -s "$RUNNER_TEMP/rime-event-smoke.json"
          cat "$RUNNER_TEMP/rime-event-smoke.json"
      - name: Assert actual Rime event contract (not fake fixture results)
        run: |
          python3 - <<'PY'
          import json,os
          p=os.environ["RUNNER_TEMP"]+"/rime-event-smoke.json"
          result=json.load(open(p,encoding="utf-8"))
          assert result["engineReady"], result
          assert len(result["trials"]) == 10, result
          assert result["allEventInvariantsPass"], result
          assert result["eventsEmitted"] >= 6, ("expected six baseline selections to commit",result)
          assert any(row["confirmedSelection"] and not row["expanded"] for row in result["trials"]), result
          assert any(row["confirmedSelection"] and row["expanded"] for row in result["trials"]), result
          targets=[row for row in result["trials"] if row["target"] == "靠北"]
          assert len(targets)==2
          for row in targets:
            print(row["id"],"top200_rank=",row["targetRankTop200"],
                  "actual_commit=",row["commitAfterSelection"])
          print("Real iOS Simulator + Rime selection invariants passed; targeted ranks recorded")
          PY
      - name: Verify missing-phrase learning in real iOS Simulator and process restart
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/rime-harness-derived/Build/Products/Debug-iphonesimulator/KBHarness.app"
          DATA_DIR=$(xcrun simctl get_app_container "$SIM_UDID" com.kbtest.harness data)
          for PHASE in observe-once train verify reset privacy; do
            xcrun simctl terminate "$SIM_UDID" com.kbtest.harness || true
            xcrun simctl launch "$SIM_UDID" com.kbtest.harness "--personal-phrase-phase=$PHASE"
            RESULT="$DATA_DIR/Documents/personal-phrase-$PHASE.json"
            for n in {1..35}; do
              if test -s "$RESULT"; then break; fi
              sleep 2
            done
            test -s "$RESULT"
            cp "$RESULT" "$RUNNER_TEMP/personal-phrase-$PHASE.json"
            cat "$RESULT"
          done
          python3 - <<'PY'
          import json,os
          root=os.environ["RUNNER_TEMP"]
          def load(p):
              return json.load(open(f"{root}/personal-phrase-{p}.json", encoding="utf-8"))
          first,train,verify,reset,privacy=map(load,
              ("observe-once","train","verify","reset","privacy"))
          assert first["engineReady"] and first["originalPhraseAbsent"],first
          assert first["realSelectionsPass"] and first["notLearnedYet"],first
          assert train["realSelectionsPass"] and train["learned"],train
          assert train["fullFound"] and train["initialFound"],train
          assert train["fusedFullFirst"] and train["fusedInitialFirst"],train
          assert train["nativeIndicesPreserved"],train
          assert verify["persisted"] and verify["fullFound"] and verify["initialFound"],verify
          assert verify["confirmedPersonalCandidate"] and verify["negativeFeedbackApplied"],verify
          assert privacy["rejectedFieldSelectionsPass"] and privacy["rejectedFieldNoLearning"],privacy
          assert privacy["cancellationNoLearning"],privacy
          assert reset["persisted"] and not reset["fullFound"] and not reset["initialFound"],reset
          print("Real Rime absent phrase learned across restarts, recalled, corrected, privacy-gated and reset")
          PY
      - name: Upload safe fixture-only simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-real-rime-event-smoke
          path: ${{ runner.temp }}/rime-event-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: On failure show focused compiler diagnostics
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/rime-harness-build.log"; then
            grep -E 'error:|fatal error:|BUILD FAILED' "$RUNNER_TEMP/rime-harness-build.log" | tail -50 || true
          fi
