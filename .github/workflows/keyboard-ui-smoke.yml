name: iOS Embedded Keyboard Candidate UI Smoke

on:
  push:
    branches: [dev/learning-events]
    paths:
      - ".github/workflows/keyboard-ui-smoke.yml"
      - "OnionKB/Keyboard/KeyboardViewController.swift"
      - "OnionKB/Keyboard/PersonalCandidateFusion.swift"
      - "OnionKB/Keyboard/PersonalPhraseLearning.swift"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stoat-embedded-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedded-candidate-ui:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build actual keyboard controller inside iOS UI harness
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          mkdir -p RimeData
          bash OnionKB/Scripts/select-variant.sh plustrim
          cd OnionKB
          xcodegen generate
          xcodebuild -project OnionKB.xcodeproj -scheme KBHarness \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/kb-ui-derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/kb-ui-build.log" 2>&1 || {
              grep -E 'error:|fatal error:|BUILD FAILED' "$RUNNER_TEMP/kb-ui-build.log" | tail -60 || true
              exit 1
            }
      - name: Boot real installed iOS Simulator
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          sdk=sys.argv[1]
          matches=[r for r in json.load(sys.stdin)["runtimes"]
                   if r.get("isAvailable") and "iOS" in r.get("name","")
                   and r.get("version")==sdk]
          if not matches: raise SystemExit("Missing installed SDK-matched iOS runtime")
          print(matches[0]["identifier"])
          ' "$SDK")
          DEVICE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          devices=json.load(sys.stdin)["devicetypes"]
          phones=[d for d in devices if d.get("name")=="iPhone 17 Pro"]
          if not phones: phones=[d for d in devices if d.get("name","").startswith("iPhone")]
          if not phones: raise SystemExit("No iPhone device type")
          print(phones[0]["identifier"])
          ')
          UDID=$(xcrun simctl create "Stoat-Embedded-Candidates" "$DEVICE" "$RUNTIME")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus "$UDID" -b
      - name: Tap actual candidate UI controls in embedded harness
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/kb-ui-derived/Build/Products/Debug-iphonesimulator/KBHarness.app"
          test -f "$APP/KBHarness"
          test -n "$(find "$APP" -name 'bopomo_onion*.bin' -print -quit)"
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.kbtest.harness --personal-ui-smoke
          DIR=$(xcrun simctl get_app_container "$SIM_UDID" com.kbtest.harness data)
          RESULT="$DIR/Documents/personal-ui-smoke.json"
          for attempt in {1..50}; do
            if test -s "$RESULT"; then break; fi
            sleep 2
          done
          test -s "$RESULT"
          cp "$RESULT" "$RUNNER_TEMP/personal-ui-smoke.json"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ["RUNNER_TEMP"],"personal-ui-smoke.json")
          data=json.load(open(p,encoding="utf-8"))
          print(data)
          required=["ready","barFirst","barTap","expandedTap","nativeIndexPreserved"]
          assert all(data.get(key) is True for key in required),(required,data)
          print("Embedded real KeyboardViewController candidate UI callbacks passed")
          PY
      - name: Archive fixture-only embedded UI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-embedded-candidate-ui
          path: ${{ runner.temp }}/personal-ui-smoke.json
          if-no-files-found: warn
          retention-days: 14
