name: iOS Real Third-Party Keyboard Host Acceptance

on:
  push:
    branches: [dev/learning-events]
    paths:
      - ".github/workflows/keyboard-host-ui.yml"
      - "OnionKB/UITests/**"
      - "OnionKB/Harness/HarnessMain.swift"
      - "OnionKB/project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stoat-real-host-keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-hosted-keyboard:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Generate real app, extension, host and XCUITest targets
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          mkdir -p RimeData
          bash OnionKB/Scripts/select-variant.sh plustrim
          cd OnionKB
          xcodegen generate
          xcodebuild -list -project OnionKB.xcodeproj | tee "$RUNNER_TEMP/stoat-host-schemes.txt"
          grep -q KeyboardExtensionHostUITests "$RUNNER_TEMP/stoat-host-schemes.txt"

      - name: Boot SDK-matched Simulator with software keyboard
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          candidates=[r for r in json.load(sys.stdin)["runtimes"]
                      if r.get("isAvailable") and "iOS" in r.get("name","")
                      and r.get("version")==sys.argv[1]]
          if not candidates: raise SystemExit("Missing SDK-matched installed iOS runtime")
          print(candidates[0]["identifier"])
          ' "$SDK")
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          devices=json.load(sys.stdin)["devicetypes"]
          choices=[x for x in devices if x.get("name")=="iPhone 17 Pro"]
          if not choices: choices=[x for x in devices if x.get("name","").startswith("iPhone")]
          if not choices: raise SystemExit("No iPhone model")
          print(choices[0]["identifier"])
          ')
          UDID=$(xcrun simctl create "Stoat-Real-Host-UI" "$TYPE" "$RUNTIME")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          python3 - "$UDID" <<'PY'
          import pathlib,plistlib,sys
          p=pathlib.Path.home()/"Library/Preferences/com.apple.iphonesimulator.plist"
          data=plistlib.loads(p.read_bytes()) if p.exists() else {}
          data.setdefault("DevicePreferences",{}).setdefault(sys.argv[1],{})["ConnectHardwareKeyboard"]=False
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(plistlib.dumps(data))
          PY
          xcrun simctl boot "$UDID"
          perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus "$UDID" -b

      - name: Build and install actual Stoat.app with keyboard extension
        run: |
          set -euo pipefail
          cd OnionKB
          xcodebuild -project OnionKB.xcodeproj -scheme OnionKB \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/stoat-host-derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/stoat-host-build.log" 2>&1 || {
              grep -E 'error:|fatal error:|BUILD FAILED' "$RUNNER_TEMP/stoat-host-build.log" | tail -60 || true
              exit 1
            }
          APP="$RUNNER_TEMP/stoat-host-derived/Build/Products/Debug-iphonesimulator/OnionKB.app"
          test -f "$APP/PlugIns/OnionKBKeyboard.appex/OnionKBKeyboard"
          test -n "$(find "$APP/PlugIns/OnionKBKeyboard.appex" -name 'bopomo_onion*.bin' -print -quit)"
          xcrun simctl install "$SIM_UDID" "$APP"
          echo "Installed genuine host container + keyboard extension (not embedded harness)."

      - name: Enable Stoat in iOS Settings and type into ordinary host using XCUITest
        run: |
          set -euo pipefail
          cd OnionKB
          xcodebuild test -project OnionKB.xcodeproj -scheme KeyboardExtensionHostUITests \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/stoat-host-derived" \
            -resultBundlePath "$RUNNER_TEMP/stoat-real-keyboard-ui.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:KeyboardExtensionHostUITests/KeyboardExtensionHostTests/testInstalledThirdPartyExtensionInOrdinaryTextField \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test > "$RUNNER_TEMP/stoat-real-host-ui.log" 2>&1 || {
              grep -E 'error:|fatal error:|failed|FAIL|Assertion|Test Case' "$RUNNER_TEMP/stoat-real-host-ui.log" | tail -100 || true
              exit 1
            }
          echo "REAL THIRD-PARTY KEYBOARD HOST E2E PASSED"

      - name: Archive fixture-only logs and XCTest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-real-third-party-keyboard-host
          path: |
            ${{ runner.temp }}/stoat-real-keyboard-ui.xcresult
            ${{ runner.temp }}/stoat-real-host-ui.log
            ${{ runner.temp }}/stoat-host-schemes.txt
          if-no-files-found: warn
          retention-days: 14
